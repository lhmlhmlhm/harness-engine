version: 2
ability: worktree
title: Worktree isolation facts

# BORROWED, NEVER ROUTED. `library` is what this is: `requires:`-able like a production
# ability, absent from the routing roster like a fixture, and excluded from the
# criteria-strength report because the single step below exists only to satisfy the
# engine's "at least one step" rule.
#
# Before the role existed this was `production` carrying a `when:` whose content was that
# it must not be used — and since the roster is DERIVED from `when:`, the engine printed
# that sentence to every agent reading the list for a choice. A hint that says "not this"
# is still an entry; the only thing stopping a mis-route was the agent reading to the end.
# The engine now refuses a `when:` here, so unroutability is a property rather than a plea.
# 工具刻意不在这里。供应脚本有 15% 是 brazil 工作区骨架的逻辑（`packageInfo` / `env/` / `src/<Pkg>`），
# 而这里的 provider 一处都没提到 brazil —— 事实是通用的 git 与目录问题，供应不是。所以脚本跟着它
# 唯一的消费方走，本 ability 只留可被任何 ship 借用的那一半。
role: library

# NOT MEANT TO BE OPENED. This ability exists so a ship-like flow can `requires: [worktree]` and
# ask whether its work is really isolated. Its own run has nothing to accomplish.
#
# It is `production` rather than `fixture` for one structural reason: the engine refuses to let a
# production ability `requires:` a fixture (flow.py — "a fixture must be UNROUTABLE ... and no
# production ability may `requires:` one"). Borrowability and unroutability are the two ends of
# that constraint and only one is available, so the routing hint below is written to say "not
# this" as plainly as a routing hint can. The engine does not enforce that reading; a reader is
# the only thing that can.
# A scope no other ability shares, so opening this by accident cannot collide with a real run's
# lease. `scope_kind` may not be empty, and every value is a shared namespace, so it says what it
# is: a probe, not a unit of work.
scope_kind: worktree_probe

uses: [phase_goals, results]

# 它只有一种终态：不该被开，所以开了就是放弃。没有 `completed` —— 声明一个永远不会发生的
# 终态，等于给"这个 run 有意义"留了个口子。
results:
  values: [abandoned]
  default: abandoned

phases:
  - id: facts
    title: Facts only
    goal:
      type: all_of
      steps: [W00]

steps:
  - id: W00
    phase: facts
    title: Placeholder — this ability is borrowed, not walked
    directive: |
      产出：无。
      完成：无。

      本步存在的唯一原因是引擎要求每个 flow 至少声明一步（`'steps' must declare at least one
      step`）。如果你正在读这条 directive，说明有人开了一个不该开的 run —— 关掉它，去开真正
      拥有该生命周期的那个 flow。

      本 ability 只有事实，没有工具：`providers.py` 注册的 `worktree_state` 由别的 flow 通过
      `requires: [worktree]` + `facts.providers: [worktree.worktree_state]` 借用。
    completion:
      type: evidence
      kind: worktree_probe_noop
