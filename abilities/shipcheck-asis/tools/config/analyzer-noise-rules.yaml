# analyzer-noise-rules.yaml — inherent-noise classification rules for composite auto_fix.
#
# Consumed by analyzer-comment-classify.py. A comment matching any rule is classified
# `inherent-noise` (skip auto_fix, surface as override) rather than `actionable`.
# Conservative default: a comment matching NO rule is `actionable` (we never silently
# skip a potential real defect).
#
# Rationale: snapshot/bundle CRs inherently trip size + terminology analyzers on COPIED
# content (see shared-kb anti-pattern anti-snapshot-cr-analyzer-noise-as-defect). Editing
# copied content to appease them corrupts snapshot fidelity.
#
# To add a rule: append below. Match fields (all optional, ALL present must match — AND):
#   analyzer      : substring match on the analyzer/bot name (case-insensitive)
#   content_match : substring that must appear in the comment body (case-insensitive)
#   path_glob     : fnmatch glob the comment's file location must match
#   max_importance: comment importance must be <= this (analyzer advisories are usually 0)
version: "1.0"

rules:
  - id: acodereviewaday-gargantuan
    analyzer: ACodeReviewADay
    content_match: GARGANTUAN
    max_importance: 0
    reason: "size advisory inherent to bulk/snapshot CR; cannot be fixed without splitting"

  - id: inclusivetech-copied-exports
    analyzer: InclusiveTechScanner
    path_glob: "**/exports/**"
    max_importance: 0
    reason: "terminology inside copied memory-export snapshot (not authored content)"

  - id: inclusivetech-copied-skill
    analyzer: InclusiveTechScanner
    path_glob: "**/skills/*/SKILL.md"
    max_importance: 0
    reason: "terminology inside copied SKILL.md (framework snapshot, not authored content)"

  - id: inclusivetech-copied-references
    analyzer: InclusiveTechScanner
    path_glob: "**/references/**"
    max_importance: 0
    reason: "terminology inside copied reference docs (framework snapshot)"

  - id: coverlay-no-coverage-data
    analyzer: Coverlay
    content_match: "No coverage data found"
    max_importance: 0
    reason: "coverage advisory; markdown/tool-script package has no unit-test coverage report"
