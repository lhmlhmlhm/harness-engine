    产出：分数持久化到库 + 一条最终小结
    完成：分数已落库，小结已给出
  deps:
  - E23
  completion:
    type: all_checks
    checks:
    - type: evidence
      kind: final_summary
    - type: evidence_in
      kind: score_persistence
      values:
      - persisted
      - warned
    # 上报的收口。三个合法值**每一个**都有各自的反驳事实 —— 这是刻意的：只核对
    # 「已上报」会把另两个变成免费出口，而参照系统正是在那里累计了 162 次强制确认。
    - type: evidence_in
      kind: fleet_report
      values:
      - sent
      - unreachable
      - not_applicable
    - type: claim_corroborated       # 说上报了 -> 协调方那边必须真的有东西到达
      kind: fleet_report
      claims:
      - sent
      disproved_when:
        fact: fleet_event_count
        count_lte: 0
    - type: claim_corroborated       # 说连不上 -> 但它其实答得上来
      kind: fleet_report
      claims:
      - unreachable
      disproved_when:
        fact: fleet_reachable
        equals: true
    - type: claim_corroborated       # 说不适用 -> 但 C01 记的是一个真任务 id
      kind: fleet_report
      claims:
      - not_applicable
      disproved_when:
        fact: fleet_applicable
        equals: true
- id: E25
  phase: cleanup
  stage: close
  title: Exit
  directive: |
    产出：会话置终态、结束
    完成：会话已关闭为「已交付」
  deps:
  - E24
  completion:
    type: no_open_violations
- id: E13
  phase: cleanup
  stage: close
  title: Ship-完成 invariant gate (pre-exit; 排在 E24 之后 E25 之前)
  directive: |
    产出：一个通过/失败的完成判定
    完成：4 项 pre-exit 谓词全部为真
  deps:
  - E25
  completion:
    type: all_checks
    checks:
    - type: phases_summarized
    - type: evidence
      kind: pre_exit_verdict
      min_count: 4
- id: E22a
  phase: cleanup
  stage: close
  title: Y 分支完整 cleanup
  directive: |
    产出：方案文档移入完成区、隔离工作树按条件拆除
    完成：文档已归位，工作树按策略处理完毕
  deps:
  - E13
  completion:
    type: all_checks
    checks:
    - type: evidence
      kind: close_cleanup
    - type: evidence_in
      kind: worktree_disposition
      values:
      - removed
      - kept_review_open
      - kept_dirty
      - no_worktree
    # 「本来就没有工作树」是 21 处按自己的话被接受的声称之一。按 run id 匹配而不是数
    # 全局数量：别的 session 的工作树说明不了这一个。
    - type: claim_corroborated
      kind: worktree_disposition
      claims:
      - no_worktree
      disproved_when:
        fact: own_worktree_exists
        equals: true
    # 方案文档的归位，与工作树同一形态：agent 跑写回脚本，引擎只读核实。
    # 三个取值各有反驳事实 —— 只核 filed 会把另两个变成免费出口。
    # 注意「按 slug 解析而非按早先记下的路径」：收口的全部意义就是那个文件被移走了，
    # 读记录的路径要么找不到（把成功报成失败），要么还在原处（把没发生的移动报成成功）。
    - type: evidence_in
      kind: plan_disposition
      values:
      - filed
      - kept_open
      - no_plan_doc
    - type: claim_corroborated       # 说已归位 -> 但它还不在完成区
      kind: plan_disposition
      claims:
      - filed
      disproved_when:
        fact: plan_doc_dir
        in:
        - pending
        - pushed
        - in-progress
    - type: claim_corroborated       # 说仍留着 -> 但它已经在完成区了
      kind: plan_disposition
      claims:
      - kept_open
      disproved_when:
        fact: plan_doc_dir
        in:
        - done
        - shipped
    - type: claim_corroborated       # 说没有方案文档 -> 但按 slug 找到了一份
      kind: plan_disposition
      claims:
      - no_plan_doc
      disproved_when:
        fact: plan_doc_found
        equals: true
- id: E22b
  phase: cleanup
  stage: close
  title: N 分支 deferred close 提示
  directive: |
    产出：一条延后关闭的提示
    完成：已给出稍后如何关闭的提示
  deps:
  - E22a
  completion:
    type: evidence
    kind: deferred_close
