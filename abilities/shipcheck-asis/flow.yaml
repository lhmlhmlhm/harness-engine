# ability: shipcheck-asis —— 真实 ship-check 流程的忠实转写（对照用，非移植）
#
# 从 state_machine.py 的 CANONICAL_STEPS 程序化导出，并按 data/step-coding.md 复核：
# 注册表 111 步里 101 步有实证内容，10 步是注册了但无内容的占位（CF01-CF08 / E05 / E22），
# 已剔除。E22 的真实分支是 E22a/E22b，声明为互斥组。
#
# 【承重点】本文件验证的是：领域工具算出事实 → 引擎按声明的条件决定该不该 gate。
# 引擎只会「记录一个 gate」，不会「算出该不该 gate」—— 后者是 2,143 行的爆炸半径
# 分析，作为黑盒复制在 tools/，经 providers.py 声明成 8 个事实接进来。

version: 1
ability: shipcheck-asis
title: 交付生命周期（真实 ship-check 转写）
scope_kind: repo
# 本 ability 的 scope 就是一个代码库位置，所以运行时在其子目录里发生的动作属于本 run。
# 默认是 exact —— 放宽是**每个 ability 显式声明**的，因为误判比漏判更糟：
# 被要求去满足一个不属于自己工作的门，会让伪造那个门成为唯一出路。
scope_match: path_prefix
prose:
  root: prose/
  topics_dir: topics
  anchor_pattern: ^#{1,6}\s+Step:\s+{step_id}\b
facts:
  providers:
  - blast_radius
  - decision_gate
  - review_comments
hooks:
- id: blast-radius-failures
  trigger: phase_end
  phase: verification
  when:
    fact: failed_assertions
    count_gte: 1
  mode: contract
  obligation: true
  contract: |
    爆炸半径断言失败：{{fact.failed_assertions}}
    这不是「跑完了」，是「算出来有问题」。逐条给出结论，然后：
      harness discharge --run {{run_id}} --hook blast-radius-failures \\
        --evidence "<每条断言的处置>"
# 分析跑了、也没报错，但它其实什么都没查 —— 这是最坏的一种「干净」，
# 因为它和真正的干净在下游完全一样。必须显式销账。
- id: blast-radius-vacuous
  trigger: phase_end
  phase: verification
  when:
    all_of:
    - fact: analysis_ran
      equals: true
    - fact: checks_meaningful
      equals: false
  mode: contract
  obligation: true
  contract: |
    爆炸半径分析运行了，但本轮没有声明任何改动文件（declared_file_count=0），
    所以它的十几条断言全部退化成「不适用」—— 这个 all-clear 不代表任何事。
    要么补上改动清单证据（kind=change_file / old_value / api_constant），
    要么说明为什么本轮不需要这层检查：
      harness discharge --run {{run_id}} --hook blast-radius-vacuous \
        --evidence "<补了清单 / 为何不需要>"
- id: blast-radius-manual
  trigger: phase_end
  phase: verification
  when:
    all_of:
    - fact: analysis_ran
      equals: true
    - fact: manual_count
      count_gte: 1
  mode: contract
  obligation: false
  contract: |
    有 {{fact.manual_count}} 条断言是 manual 档（{{fact.manual_assertions}}）——
    静态分析给不出判定，需要你自己下结论。别当成 pass。
- id: blast-radius-absent
  trigger: phase_end
  phase: verification
  when:
    fact: analysis_ran
    equals: false
  mode: contract
  obligation: true
  contract: |
    爆炸半径分析没有运行（工具缺失或 scope 不是目录）。
    「没跑」和「跑了没发现问题」在下游长得一样，所以必须显式销账：
      harness discharge --run {{run_id}} --hook blast-radius-absent \\
        --evidence "<为什么可以不跑>"
config:
  auto_confirm_config: false
  cleanup_entry_auto: false
  auto_confirm_ship: false
guards:
  # 「哪个工具调用等于哪个动作」是本 ability 的知识，所以写在这里而不是引擎里。
  # 引擎只编译 pattern 并施加它 —— 它不知道 `git commit` 是什么意思。
  # scope_match: path_prefix（见顶部）让本 run 的 scope 覆盖其子目录里发生的动作。
  commit:
    step: E04
    matches:
      # 模式故意「宽进」：`git` 必须在一个命令段的开头，然后段内任意内容，
      # 最后一个**独立的** commit 词。第一版写成枚举 flag（`(-\S+\s+)*`）漏掉了
      # `git -c user.name=x commit` —— `-c` 的参数是独立 token，而那是常见写法。
      # 在这一条上过匹配优于漏匹配，而这与「guard 误判比漏判更糟」不冲突：
      # 那条讲的是**误判成别人的 run**，而 scope 已经把范围限定住了；在**正确的
      # run 内**多拦一次无害的 `git` 读命令，只是一次响亮且合法的补门。
      # 而漏一次真提交，等于这个门可以靠改措辞绕过 —— 那会让整个门失去意义。
      # `git log --grep=commit` 不会命中：commit 前是 `=` 而非空白。
      - tool: shell
        field: command
        pattern: '(^|[;&|]\s*)git\b[^;&|]*?\s+commit\b'
  cr_push:
    step: E04
    matches:
      - tool: shell
        field: command
        pattern: '(^|[;&|]\s*)cr\b(?=.*\s-o\b)'
  task_close:
    step: E21
    matches:
      - tool: TaskeiUpdateTask
        pattern: '"status"\s*:\s*"Closed"'
  plan_mv:
    step: E21
    matches:
      - tool: shell
        field: command
        pattern: '(^|[;&|]\s*)mv\b.*\bpending/.*\bdone/'
exclusive_groups:
- - E22a
  - E22b
phases:
- id: context
  title: context（25 步）
  guide: context.md
  stages:
  - activation
  - resume
  - pre-flight
  - plan-confirmation
  - understanding-gate
  goal:
    type: phase_steps_closed
- id: config
  title: config（2 步）
  guide: config.md
  stages:
  - config-collect
  goal:
    type: phase_steps_closed
- id: coding
  title: coding（5 步）
  guide: coding.md
  stages:
  - implementation
  goal:
    type: phase_steps_closed
- id: verification
  title: verification（17 步）
  guide: verification.md
  stages:
  - test-execution
  - blast-radius
  - decision-gate
  goal:
    type: phase_steps_closed
- id: execution
  title: execution（9 步）
  guide: execution.md
  stages:
  - commit-prep
  - ship
  goal:
    type: phase_steps_closed
- id: observation
  title: observation（8 步）
  guide: observation.md
  stages:
  - autosde
  - dry-run
  - analyzer-wait
  - pipeline-status
  - terminal-state
  goal:
    type: all_checks
    checks:
    - type: phase_steps_closed
    - type: fields_agree
      kind_a: pushed_rev
      kind_b: verified_rev
      absent_ok: true
- id: revision
  title: revision（16 步）
  guide: revision.md
  stages:
  - revision-loop
  - auto-investigation
  - conflict-rebase
  goal:
    type: phase_steps_closed
- id: cleanup
  title: cleanup（19 步）
  guide: cleanup.md
  stages:
  - entry-gate
  - writeback
  - housekeeping
  - close
  goal:
    type: all_of
    steps:
    - E09g
    - E10
    - E11
    - E12
    - E19
    - E20
    - E21
    - E24
    any_of:
    - - E22a
      - E22b
steps:
- id: C00
  phase: context
  stage: activation
  title: Activation banner emit
  directive: |
    产出：一行激活横幅，末尾带上本次加载的历史经验条数，并逐条列出经验 id
    完成：横幅作为本阶段第一条叙述输出打出，且只打这一次
  completion:
    type: evidence
    kind: activation_banner
- id: C01
  phase: context
  stage: resume
  title: Plan doc lifecycle transition
  directive: |
    产出：方案文档状态从「已排期」迁到「进行中」，并移动到对应目录
    完成：找到方案文档并完成状态迁移
  optional: true
  completion:
    type: evidence
    kind: plan_doc
- id: C02
  phase: context
  stage: resume
  title: Concurrent session detection
  directive: |
    产出：确认没有另一个进程在同标识下同时跑；若是续跑，则重新把状态机锚定到正确的当前层
    完成：无并发冲突，且（若续跑）已补齐所有「到达过但没收尾」的层
  optional: true
  completion:
    type: phases_summarized
    exclude:
    - context
- id: C03
  phase: context
  stage: pre-flight
  title: Contract age check
  directive: |
    产出：一个判定——这些事实此刻可信 / 需抽查 / 已过期
    完成：给出时效判定并据此决定下一步
  deps:
  - C00
  completion:
    type: evidence_in
    kind: contract_age_verdict
    values:
    - fresh
    - spot_check
    - expired
- id: C04
  phase: context
  stage: pre-flight
  title: Code sync (git pull)
  directive: |
    产出：落后就同步到最新，本来就干净则跳过
    完成：工作区不落后于远端，或确认无需同步
  deps:
  - C03
  completion:
    type: evidence_in
    kind: code_sync_state
    values:
    - synced
    - up_to_date
- id: C05
  phase: context
  stage: pre-flight
  title: Pre-flight verification
  directive: |
    产出：逐条去代码里查证，全部命中才算过
    完成：清单全部命中
  deps:
  - C04
  completion:
    type: all_checks
    checks:
    - type: evidence
      kind: verified_fact
    - type: evidence_all_in
      kind: fact_verdict
      values:
      - hit
- id: C06
  phase: context
  stage: pre-flight
  title: Platform quirks lookup
  directive: |
    产出：命中已知平台特性时，把编译/测试命令的覆盖值缓存给后续层用
    完成：完成一次查表，命中则缓存
  deps:
  - C05
  completion:
    type: all_checks
    checks:
    - type: evidence
      kind: platform_quirk
    - type: evidence_in
      kind: quirk_lookup
      values:
      - hit
      - miss
- id: C07
  phase: context
  stage: pre-flight
  title: Dependency check (depends_on)
  directive: |
    产出：确认每个上游都已发布/完成
    完成：所有上游依赖状态为已就绪
  deps:
  - C06
  completion:
    type: evidence_in
    kind: dependency_check
    values:
    - all_ready
    - no_dependencies
- id: C08
  phase: context
  stage: plan-confirmation
  title: Problem diagnosis
  directive: |
    产出：现象、根因、影响面（附查证结果）
    完成：三要素清晰、有证据支撑
  deps:
  - C07
  completion:
    type: evidence
    kind: diagnosis
- id: C09
  phase: context
  stage: plan-confirmation
  title: Solution selection
  directive: |
    产出：多解法时列出对比；确定性修复可跳过
    完成：方案唯一确定，或对比清单已备好待确认
  deps:
  - C08
  completion:
    type: all_checks
    checks:
    - type: evidence
      kind: solution_choice
    - type: evidence_in
      kind: solution_form
      values:
      - single
      - compared
- id: C10
  phase: context
  stage: plan-confirmation
  title: Change details
  directive: |
    产出：一张改动表（路径 / 操作 / 锚点 / 手动还是自动）
    完成：每处改动都能对应到具体位置
  deps:
  - C09
  completion:
    type: evidence
    kind: change_file
- id: C11
  phase: context
  stage: plan-confirmation
  title: Investigation rigor
  directive: |
    产出：穷尽式查证的结果，确认没有漏网的同类点
    完成：同类点已穷尽、数值有依据
  deps:
  - C10
  completion:
    type: evidence
    kind: old_value
- id: C12
  phase: context
  stage: plan-confirmation
  title: Parser sample verification
  directive: |
    产出：拿真实样本喂一遍，确认匹配范围既不多也不少
    完成：规则在样本上表现符合预期
  deps:
  - C11
  completion:
    type: evidence_in
    kind: parser_sample_verdict
    values:
    - as_expected
- id: C13
  phase: context
  stage: plan-confirmation
  title: Self-loop check
  directive: |
    产出：确认「被改的东西」和「用来验证的东西」不是同一个
    完成：验证与改动相互独立
  deps:
  - C12
  completion:
    type: evidence_in
    kind: self_loop_check
    values:
    - independent
- id: C14
  phase: context
  stage: plan-confirmation
  title: Direction confirmation
  directive: |
    产出：明确「事实来源」和总体改动方向
    完成：改动方向与权威来源一致
  deps:
  - C13
  completion:
    type: evidence_in
    kind: direction_source_agreement
    values:
    - aligned
- id: C15
  phase: context
  stage: plan-confirmation
  title: Impact analysis
  directive: |
    产出：一张下游依赖状态表——谁会因此受影响
    完成：下游影响已列全
  deps:
  - C14
  completion:
    type: evidence
    kind: module_under_test
- id: C16
  phase: context
  stage: plan-confirmation
  title: Risk declaration
  directive: |
    产出：风险点 + 每个风险的回退路径
    完成：风险与回退都写明
  deps:
  - C15
  completion:
    type: evidence
    kind: risk
- id: C17
  phase: context
  stage: plan-confirmation
  title: Fuzzy logic check
  directive: |
    产出：把这些「非确定」逻辑显式标出来
    完成：模糊判定点已全部点名
  deps:
  - C16
  completion:
    type: evidence
    kind: fuzzy_logic_point
- id: C18
  phase: context
  stage: plan-confirmation
  title: Multi-path disambiguation
  directive: |
    产出：明确这次到底改的是哪一处
    完成：目标路径唯一、无歧义
  deps:
  - C17
  completion:
    type: evidence
    kind: disambiguated_target
- id: C19
  phase: context
  stage: plan-confirmation
  title: L3 patterns recall
  directive: |
    产出：召回相关的历史解法与反面教训，展示给发起人；命中就列出，未命中则跳过
    完成：完成一次召回，并（若命中）随后重算经验热度
  deps:
  - C18
  completion:
    type: all_checks
    checks:
    - type: evidence
      kind: pattern_recall
    - type: evidence_in
      kind: recall_result
      values:
      - hit
      - miss
- id: C20
  phase: context
  stage: plan-confirmation
  title: 🚦 User confirm gate
  directive: |
    产出：发起人对方案的明确表态——同意 / 要改 / 取消
    完成：拿到「同意」这一确定信号（或读到显式预授权配置）后才放行
  deps:
  - C19
  gate: affirm
  completion:
    type: gate_recorded
- id: C21
  phase: context
  stage: plan-confirmation
  title: LLM schema exposure check
  directive: |
    产出：确认暴露面符合预期
    完成：schema 暴露已审
  deps:
  - C20
  completion:
    type: evidence_in
    kind: schema_exposure
    values:
    - as_expected
- id: C22
  phase: context
  stage: plan-confirmation
  title: Initial state persist (DB)
  directive: |
    产出：确认持久化状态库里已建好本次运行的记录行
    完成：状态库记录行存在且可回读
  deps:
  - C21
  completion:
    type: evidence
    kind: initial_state_row
- id: C24
  phase: context
  stage: plan-confirmation
  title: Layer score emit
  directive: |
    产出：本层的评分与交棒信号
    完成：分数已 emit，交棒给下一层
  deps:
  - C22
  completion:
    type: all_checks
    checks:
    - type: evidence
      kind: layer_summary
    - type: evidence
      kind: handoff_marker
- id: C07b
  phase: context
  stage: understanding-gate
  title: Diagnosis challenge (M1/M2/M3 skeptic)
  directive: |
    产出：经过质疑、被证伪过一轮的诊断结论
    完成：诊断挺过了 M1/M2/M3 三轮质疑
  optional: true
  completion:
    type: evidence_in
    kind: diagnosis_challenge
    values:
    - survived
- id: CF00
  phase: config
  stage: config-collect
  title: Config resolution + persist
  directive: |
    产出：一个持久化到运行状态里的 `config` 对象
    完成：① 偏好已写盘 ② 本步的确认 gate 已记录（`affirm`，或经显式预授权的 `preauth`）
  deps:
  - C24
  gate: preauth:auto_confirm_config
  completion:
    type: all_checks
    checks:
    - type: gate_recorded
    - type: evidence
      kind: config
- id: CF09
  phase: config
  stage: config-collect
  title: Layer score emit
  directive: |
    产出：本层的完成打分与交接标记
    完成：CF00 已通过且 gate 已记录
  deps:
  - CF00
  - C24
  completion:
    type: all_of
    steps:
    - CF00
- id: K01
  phase: coding
  stage: implementation
  title: Identify changes from plan
  directive: |
    产出：一份可执行的工作清单（每项：文件路径 / 操作 / 锚点）
    完成：每一项都有明确的路径、操作和一个已验证存在的锚点
  topics:
  - heredoc-hangs
  deps:
  - CF09
  completion:
    type: evidence
    kind: change_file
- id: K02
  phase: coding
  stage: implementation
  title: Apply plan edits
  directive: |
    产出：符合清单的改动 + 一条 diff 证据
    完成：清单各项都已落地、无编译错误
  topics:
  - mutation-verification-traps
  deps:
  - K01
  completion:
    type: all_checks
    checks:
    - type: evidence
      kind: code_diff
    - type: evidence_equals
      kind: compile_result
      value: pass
- id: K03
  phase: coding
  stage: implementation
  title: Compile check (v1.29.0 renamed)
  directive: |
    产出：编译结果（过 / 未过）
    完成：纯编译通过；没有编译工具链的项目（如纯文档改动）可跳过
  deps:
  - K02
  completion:
    type: evidence_in
    kind: compile_result
    values:
    - pass
- id: K04
  phase: coding
  stage: implementation
  title: Diff scope review (v1.29.0 renamed)
  directive: |
    产出：范围比对结果（完全一致 / 漏改 / 越界 / 完全不符）
    完成：实际改动文件集与清单一致，或差异已被人确认接受
  deps:
  - K03
  completion:
    type: evidence_in
    kind: diff_scope_result
    values:
    - 完全一致
- id: K05
  phase: coding
  stage: implementation
  title: Layer score emit
  directive: |
    产出：本层的完成打分与交接标记
    完成：K01–K04 均已通过
  deps:
  - K04
  - CF09
  completion:
    type: all_of
    steps:
    - K01
    - K02
    - K03
    - K04
- id: D00
  phase: verification
  stage: test-execution
  title: Test framework (pytest / npm test / etc.)
  directive: |
    产出：一个结构化的**测试计划对象**——要跑哪些命令、什么算「通过」、这次改动是否根本没有框架测试可跑；写入状态存储
    完成：测试计划对象已产出并落盘，下游每一步都能读到它
  deps:
  - K05
  completion:
    type: evidence
    kind: test_plan
- id: D01
  phase: verification
  stage: blast-radius
  title: Identify scope
  directive: |
    产出：改动的真实表面——动了哪些文件、符号、常量、路径，并与计划声称要改的对齐
    完成：范围清单成型，且与计划一致（或偏差已解释）
  deps:
  - D00
  completion:
    type: all_checks
    checks:
    - type: evidence
      kind: change_file
    - type: evidence_in
      kind: scope_vs_plan
      values:
      - matches
      - deviation_explained
- id: D02
  phase: verification
  stage: blast-radius
  title: Static dependency scan
  directive: |
    产出：静态引用被动过符号的直接依赖方
    完成：直接依赖方列举完毕
  deps:
  - D01
  completion:
    type: evidence
    kind: direct_dependent
- id: D03
  phase: verification
  stage: blast-radius
  title: Dynamic grep discovery
  directive: |
    产出：静态扫描看不见的引用（字符串键、配置、文档里的引用）
    完成：旧值在仓库里的残留 = 0，或残留都已解释
  deps:
