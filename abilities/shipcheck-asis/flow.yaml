# ability: shipcheck-asis —— 真实 ship-check 流程的忠实转写（对照用，非移植）
#
# 从 state_machine.py 的 CANONICAL_STEPS 程序化导出，并按 data/step-coding.md 复核：
# 注册表 111 步里 101 步有实证内容，10 步是注册了但无内容的占位（CF01-CF08 / E05 / E22），
# 已剔除。E22 的真实分支是 E22a/E22b，声明为互斥组。
#
# 【承重点】本文件验证的是：领域工具算出事实 → 引擎按声明的条件决定该不该 gate。
# 引擎只会「记录一个 gate」，不会「算出该不该 gate」—— 后者是 2,143 行的爆炸半径
# 分析，作为黑盒复制在 tools/，经 providers.py 声明成 8 个事实接进来。

version: 2
ability: shipcheck-asis
title: 交付生命周期（真实 ship-check 转写）
scope_kind: repo

# 这条流程可以怎样结束。声明出来，`--result` 才有词汇表可对 —— 在这之前它接受任意字符串，
# 于是 done / completed 和 abort / aborted 成了四个词表达两件事，history 也就无法聚合。
results:
  values: [completed, abandoned]
  default: completed

# 这条 flow 依赖的引擎机制。加载期与 flow 实际做的事**双向核对**：
# 声明了没用 -> 拒；用了没声明 -> 拒。它不是开关（可关掉的强制不是强制），
# 而是这条 flow 的表面 + 一份会指名缺了什么的引擎版本契约。
uses: [exclusive_groups, facts, gates, guards, hooks, obligations, optional_steps, phase_goals, prose, repeatable, results, stages]

when: |
  任务要改代码、要提交、要发评审 —— 交付**自己的**改动。这是最重的一条流程（101 步），
  但它的重量正对应交付的不可逆性；轻量改动也走它，只是很多步会被 skip。
# 本 ability 的 scope 就是一个代码库位置，所以运行时在其子目录里发生的动作属于本 run。
# 默认是 exact —— 放宽是**每个 ability 显式声明**的，因为误判比漏判更糟：
# 被要求去满足一个不属于自己工作的门，会让伪造那个门成为唯一出路。
scope_match: path_prefix_or_payload
prose:
  root: prose/
  topics_dir: topics
  anchor_pattern: ^#{1,6}\s+Step:\s+{step_id}\b
facts:
  providers:
  - blast_radius
  - decision_gate
  - review_comments
  - run_metrics
  - fleet_central
  - hot_set
  - worktree_state
  - plan_writeback
  - quality_slo
hooks:
# 上报侧的五个 hook。前四个是**提醒而非义务**，这是刻意的：一个「我报了」的义务可以用
# 一句散文销账，而那恰恰是参照系统累计 162 次强制确认的形状。真正的强制在 E24 —— 那里
# 三个合法值各有一个派生事实能反驳它。第五个是义务，因为「协调方连不上」是环境事实，
# 必须留痕而不是消失。
- id: fleet-milestone-context
  trigger: phase_end
  phase: context
  mode: contract
  contract: |
    到达一个标准里程碑。现在上报，用完成态措辞（不要报「开始 X」）：
      report_progress(task_id=<C01 记的 fleet_task>, name="完成调研",
                      description="<一句详情>", checkpoint_id="context_explored")
    到达 {{fact.fleet_event_count}} 条已到达协调方（本 run 目前）。
- id: fleet-milestone-coding
  trigger: phase_end
  phase: coding
  mode: contract
  contract: |
    到达一个标准里程碑。现在上报，用完成态措辞（不要报「开始 X」）：
      report_progress(task_id=<C01 记的 fleet_task>, name="完成实现",
                      description="<一句详情>", checkpoint_id="implementation_done")
    到达 {{fact.fleet_event_count}} 条已到达协调方（本 run 目前）。
- id: fleet-milestone-verification
  trigger: phase_end
  phase: verification
  mode: contract
  contract: |
    到达一个标准里程碑。现在上报，用完成态措辞（不要报「开始 X」）：
      report_progress(task_id=<C01 记的 fleet_task>, name="单元测试",
                      description="<一句详情>", checkpoint_id="tests_passed")
    到达 {{fact.fleet_event_count}} 条已到达协调方（本 run 目前）。
- id: fleet-milestone-execution
  trigger: phase_end
  phase: execution
  mode: contract
  contract: |
    到达一个标准里程碑。现在上报，用完成态措辞（不要报「开始 X」）：
      report_progress(task_id=<C01 记的 fleet_task>, name="创建 CR",
                      description="<一句详情>", checkpoint_id="cr_created")
    到达 {{fact.fleet_event_count}} 条已到达协调方（本 run 目前）。
# 声明里的异常规则 `high_error_violations`（error_violations > 2 -> critical）——四条规则里
# 本引擎能完整判定的一条。另三条各缺一样：compaction 计数没有、duration p95 是占位、
# revision 计数没暴露成事实。**不判不能判的**，所以这里只有一条。
- id: slo-high-error-violations
  trigger: phase_end
  phase: cleanup
  when:
    fact: error_violation_count
    count_gte: 3
  mode: contract
  obligation: true
  contract: |
    声明把「error 级 violation 超过 2 条」判为 critical，本次有 {{fact.error_violation_count}} 条
    （另有 {{fact.warning_violation_count}} 条 warning 级）。必需步骤完成率
    {{fact.completeness_rate_pct}}%，声明的 green 门槛是 {{fact.layer_green_threshold}}。
    ⚠️ 分层基线仍是占位（`baselines_are_placeholder={{fact.baselines_are_placeholder}}`），
    所以 efficiency / cost 两维**不可实测** —— 不要据此写出一个像实测的总分。
    逐条说明这些 error 级 violation 怎么处理的，然后销账：
      harness discharge --run {{run_id}} --hook slo-high-error-violations \
        --evidence "<每条怎么处理的>"
- id: fleet-central-unreachable
  trigger: phase_end
  phase: cleanup
  when:
    all_of:
    - {fact: fleet_applicable, equals: true}
    - {fact: fleet_reachable, equals: false}
  mode: contract
  obligation: true
  contract: |
    这个 run 服务的是一个被派发的任务，但协调方读不到 —— 可能连不上，也可能它答得上话
    却答不出这个任务（那个工具把后者叫 indeterminate，并且明说「could not look ->
    NO-OP is NOT granted」）。两种都不是「没什么要报」。说明是哪一种，然后销账：
      harness discharge --run {{run_id}} --hook fleet-central-unreachable \
        --evidence "<连不上 / 答不出这个任务；以及上报内容留在了哪里>"
# 两个 hook 读同一个 provider，但问的是两件不同的事，而这正是能力层与 provider 诚实位
# 各管一维的示例：能力缺失由引擎回答（该 provider 的事实全部不可用，读它的条件直接拒绝），
# 「在但没数据」由 provider 自己回答（metrics_available=false）。合成一个布尔就会让
# 「没在这个运行时里跑」与「跑了但窗口内没记录」不可区分。
- id: metrics-runtime-unreadable
  trigger: step_close
  step: E19
  when:
    fact: metrics_available
    equals: false
  mode: contract
  obligation: true
  contract: |
    运行时记录存在但这次读不到数字（会话认不出 / 窗口内没有 turn / 记录文件缺失）。
    所以小结里的指标只能是你自己的账，不是抄来的 —— 在小结里明说这一点，然后销账：
      harness discharge --run {{run_id}} --hook metrics-runtime-unreadable \
        --evidence "<为什么读不到 / 小结里怎么标注的>"
- id: metrics-context-pressure
  trigger: step_close
  step: E19
  when:
    fact: run_peak_ctx_pct
    count_gte: 85
  mode: contract
  contract: |
    这次运行的上下文峰值到了 {{fact.run_peak_ctx_pct}}%（turns={{fact.run_turns}} /
    calls={{fact.run_calls}} / credits={{fact.run_credits}}）。接近上限的运行里，
    早期读到的东西可能已经不在上下文里了 —— 小结若依赖开头的判断，值得回去核一遍。
- id: blast-radius-failures
  trigger: phase_end
  phase: verification
  when:
    fact: failed_assertions
    count_gte: 1
  mode: contract
  obligation: true
  contract: |
    爆炸半径断言失败：{{fact.failed_assertions}}
    这不是「跑完了」，是「算出来有问题」。逐条给出结论，然后：
      harness discharge --run {{run_id}} --hook blast-radius-failures \\
        --evidence "<每条断言的处置>"
# 分析跑了、也没报错，但它其实什么都没查 —— 这是最坏的一种「干净」，
# 因为它和真正的干净在下游完全一样。必须显式销账。
- id: blast-radius-vacuous
  trigger: phase_end
  phase: verification
  when:
    all_of:
    - fact: analysis_ran
      equals: true
    - fact: checks_meaningful
      equals: false
  mode: contract
  obligation: true
  contract: |
    爆炸半径分析运行了，但本轮没有声明任何改动文件（declared_file_count=0），
    所以它的十几条断言全部退化成「不适用」—— 这个 all-clear 不代表任何事。
    要么补上改动清单证据（kind=change_file / old_value / api_constant），
    要么说明为什么本轮不需要这层检查：
      harness discharge --run {{run_id}} --hook blast-radius-vacuous \
        --evidence "<补了清单 / 为何不需要>"
- id: blast-radius-manual
  trigger: phase_end
  phase: verification
  when:
    all_of:
    - fact: analysis_ran
      equals: true
    - fact: manual_count
      count_gte: 1
  mode: contract
  obligation: false
  contract: |
    有 {{fact.manual_count}} 条断言是 manual 档（{{fact.manual_assertions}}）——
    静态分析给不出判定，需要你自己下结论。别当成 pass。
- id: blast-radius-absent
  trigger: phase_end
  phase: verification
  when:
    fact: analysis_ran
    equals: false
  mode: contract
  obligation: true
  contract: |
    爆炸半径分析没有运行（工具缺失或 scope 不是目录）。
    「没跑」和「跑了没发现问题」在下游长得一样，所以必须显式销账：
      harness discharge --run {{run_id}} --hook blast-radius-absent \\
        --evidence "<为什么可以不跑>"
# ── decision_gate：那 2,614 行分析算出的裁决，真的被条件读到 ──
# 这个 provider 曾声明 6 个事实却零引用 —— 按需 gather 生效后它永远不会被调用，
# 于是 1,224 行复制进来的工具是死接线。**声明了却不生效**，正是本引擎要消灭的形态。
- id: decision-gate-blocking
  trigger: phase_end
  phase: verification
  when:
    fact: blocking_count
    count_gte: 1
  mode: contract
  obligation: true
  contract: |
    分类器判出 {{fact.blocking_count}} 项阻断级发现（{{fact.blocking_ids}}）。
    阻断级不是「注意一下」，是「这次不该往下走」。逐项处理掉，或说明为何它在本次
    改动下不成立，然后销账：
      harness discharge --run {{run_id}} --hook decision-gate-blocking \
        --evidence "<每一项怎么处理的>"
- id: decision-gate-vacuous
  trigger: phase_end
  phase: verification
  when:
    fact: pipeline_ran
    equals: false
  mode: contract
  obligation: true
  contract: |
    裁决流水线没跑起来（工具缺失或 scope 不是目录），所以裁决是空的 —— 而空裁决在
    下游读起来就是「干净」。这是最坏的一种结果形态：**它和真正的没有阻断项完全一样**。
    显式销账，说明是环境问题还是本次不适用：
      harness discharge --run {{run_id}} --hook decision-gate-vacuous \
        --evidence "<为什么没跑 / 为什么可以不跑>"
# ── review_comments：意见归类，同理 ──
- id: review-comments-actionable
  trigger: phase_end
  phase: observation
  when:
    fact: actionable_count
    count_gte: 1
  mode: contract
  obligation: true
  contract: |
    分类器判出 {{fact.actionable_count}} 条「该处理」的意见（{{fact.actionable_ids}}），
    另有 {{fact.noise_count}} 条归为固有噪声。**该处理的那些不会因为被归类而消失。**
    修掉它们（会进入修订层），或逐条说明为何不适用，然后销账：
      harness discharge --run {{run_id}} --hook review-comments-actionable \
        --evidence "<每条怎么处理的>"
- id: review-comments-vacuous
  trigger: phase_end
  phase: observation
  when:
    fact: classifier_ran
    equals: false
  mode: contract
  obligation: false
  contract: |
    意见分类器没跑（没有评审，或工具不可用）。零意见和「没查过意见」在下游长得一样，
    所以这里显式记一笔。无评审的本地交付属正常情形，本条不阻断。
config:
  auto_confirm_config: false
  cleanup_entry_auto: false
  auto_confirm_ship: false
guards:
  # 「哪个工具调用等于哪个动作」是本 ability 的知识，所以写在这里而不是引擎里。
  # 引擎只编译 pattern 并施加它 —— 它不知道 `git commit` 是什么意思。
  # scope_match: path_prefix（见顶部）让本 run 的 scope 覆盖其子目录里发生的动作。
  commit:
    step: E04
    matches:
      # 模式故意「宽进」：`git` 必须在一个命令段的开头，然后段内任意内容，
      # 最后一个**独立的** commit 词。第一版写成枚举 flag（`(-\S+\s+)*`）漏掉了
      # `git -c user.name=x commit` —— `-c` 的参数是独立 token，而那是常见写法。
      # 在这一条上过匹配优于漏匹配，而这与「guard 误判比漏判更糟」不冲突：
      # 那条讲的是**误判成别人的 run**，而 scope 已经把范围限定住了；在**正确的
      # run 内**多拦一次无害的 `git` 读命令，只是一次响亮且合法的补门。
      # 而漏一次真提交，等于这个门可以靠改措辞绕过 —— 那会让整个门失去意义。
      # `git log --grep=commit` 不会命中：commit 前是 `=` 而非空白。
      - tool: shell
        field: command
        pattern: '(^|[;&|]\s*)git\b[^;&|]*?\s+commit\b'
  cr_push:
    step: E04
    matches:
      - tool: shell
        field: command
        pattern: '(^|[;&|]\s*)cr\b(?=.*\s-o\b)'
  task_close:
    step: E21
    matches:
      - tool: TaskeiUpdateTask
        pattern: '"status"\s*:\s*"Closed"'
  # 拆除隔离工作树是不可逆的：它 remove worktree、`branch -D`、并做带守卫的 rm -rf。
  # 因此挂在 Y/N 关闭决策这个 gate 上 —— 与 task_close / plan_mv 同一个授权点。
  # 三条规则同时拦脚本与它的破坏性原语：只拦脚本的话，改个措辞就能绕过这道门。
  worktree_teardown:
    step: E21
    matches:
    # 两条规则而不是一条放宽的：只锚定命令开头会漏掉 `bash <path>/worktree-teardown.sh`
    # （实测漏），而放宽到任意空白边界会连 `echo 'run worktree-teardown.sh later'` 一起拦
    # （也实测到了）。本引擎的 matcher **没有引号感知** —— 保护来自命令开头锚定本身，
    # 所以任何拆掉锚点的改法都会同时拆掉那层保护。解释器是可枚举的，提及不是。
    - tool: shell
      field: command
      pattern: (^|[;&|]\s*)\S*worktree-teardown\.sh\b
    - tool: shell
      field: command
      pattern: (^|[;&|]\s*)(bash|sh|zsh|dash|ksh|python3?)\s+\S*worktree-teardown\.sh\b
    - tool: shell
      field: command
      pattern: (^|[;&|]\s*)git\b[^;&|]*?\s+worktree\s+remove\b
    - tool: shell
      field: command
      pattern: (^|[;&|]\s*)git\b[^;&|]*?\s+branch\s+-[dD]\b[^;&|]*?shipcheck/
  plan_mv:
    step: E21
    matches:
      - tool: shell
        field: command
        pattern: '(^|[;&|]\s*)mv\b.*\bpending/.*\bdone/'
exclusive_groups:
- - E22a
  - E22b
phases:
- id: context
  title: context（25 步）
  guide: context.md
  stages:
  - activation
  - resume
  - pre-flight
  - plan-confirmation
  - understanding-gate
  goal:
    type: phase_steps_closed
- id: config
  title: config（2 步）
  guide: config.md
  stages:
  - config-collect
  goal:
    type: phase_steps_closed
- id: coding
  title: coding（5 步）
  guide: coding.md
  stages:
  - implementation
  goal:
    type: phase_steps_closed
- id: verification
  title: verification（17 步）
  guide: verification.md
  stages:
  - test-execution
  - blast-radius
  - decision-gate
  goal:
    type: phase_steps_closed
- id: execution
  title: execution（9 步）
  guide: execution.md
  stages:
  - commit-prep
  - ship
  goal:
    type: phase_steps_closed
- id: observation
  title: observation（8 步）
  guide: observation.md
  stages:
  - autosde
  - dry-run
  - analyzer-wait
  - pipeline-status
  - terminal-state
  goal:
    type: all_checks
    checks:
    - type: phase_steps_closed
    - type: fields_agree
      kind_a: pushed_rev
      kind_b: verified_rev
      absent_ok: true
- id: revision
  title: revision（16 步）
  guide: revision.md
  stages:
  - revision-loop
  - auto-investigation
  - conflict-rebase
  goal:
    type: phase_steps_closed
- id: cleanup
  title: cleanup（19 步）
  guide: cleanup.md
  stages:
  - entry-gate
  - writeback
  - housekeeping
  - close
  goal:
    type: all_of
    steps:
    - E09g
    - E10
    - E11
    - E12
    - E19
    - E20
    - E21
    - E24
    any_of:
    - - E22a
      - E22b
steps:
- id: C00
  phase: context
  stage: activation
  title: Activation banner emit
  directive: |
    产出：一行激活横幅，末尾带上本次加载的历史经验条数，并逐条列出经验 id
    完成：横幅作为本阶段第一条叙述输出打出，且只打这一次
  completion:
    type: all_checks
    checks:
    - type: evidence
      kind: activation_banner
    # 横幅要带上加载的经验条数。三个取值各有反驳事实 —— 「查了确实是空」与「压根没查到」
    # 都渲染成 0，而源系统的常驻指令正是「命令失败不是编造 Hot Set: 0 的许可」。
    # 那句话此前只能靠散文说，这里由三个派生事实各自守一个取值。
    - type: evidence_in
      kind: hot_set_state
      values:
      - loaded
      - empty
      - unavailable
    - type: claim_corroborated       # 说加载了 -> 库里必须真有 hot 条目
      kind: hot_set_state
      claims:
      - loaded
      disproved_when:
        fact: hot_set_count
        count_lte: 0
    - type: claim_corroborated       # 说是空的 -> 但库里明明有
      kind: hot_set_state
      claims:
      - empty
      disproved_when:
        fact: hot_set_count
        count_gte: 1
    - type: claim_corroborated       # 说读不到 -> 但它读得到
      kind: hot_set_state
      claims:
      - unavailable
      disproved_when:
        fact: hot_banner_readable
        equals: true
- id: C01
  phase: context
  stage: resume
  title: Plan doc lifecycle transition
  directive: |
    产出：方案文档状态从「已排期」迁到「进行中」，并移动到对应目录
    完成：找到方案文档并完成状态迁移
  optional: true
  completion:
    type: all_checks
    checks:
    - type: evidence
      kind: plan_doc
    # 「这个 run 服务的是哪个被派发的任务」以前无处可读，于是后面「已上报」这句声称
    # 没有任何可核对的对象。值是派发方给的任务 id，或 `local`（不是被派发的活）。
    # 记在这里而不是收尾处：收尾时才声明是否适用，等于让想跳过上报的人自己决定适用性。
    - type: evidence
      kind: fleet_task
- id: C02
  phase: context
  stage: resume
  title: Concurrent session detection
  directive: |
    产出：确认没有另一个进程在同标识下同时跑；若是续跑，则重新把状态机锚定到正确的当前层
    完成：无并发冲突，且（若续跑）已补齐所有「到达过但没收尾」的层
  optional: true
  completion:
    type: phases_summarized
    exclude:
    - context
- id: C02b
  phase: context
  stage: resume
  title: Worktree isolation state
  directive: |
    产出：本次 run 的工作树形态 —— 隔离到专属工作树，或按方案声明留在共享树
    完成：形态已记录，且与方案声明一致；隔离形态经只读 git 独立核实
    注意：不要 `git checkout -b` —— 隔离分支已存在且工作树已 checkout 在它上面，
          切分支反而破坏隔离
  deps:
  - C01
  completion:
    type: all_checks
    checks:
    # 两个取值各有反驳事实。这一步的存在理由是源实现自己写下的失效模式：provisioning
    # 「FAILS HARD rather than falling back to the shared tree —— 静默退回会把调用方明确
    # 要求隔离掉的那个共享工作树行为原样交回去，同时报告成功」。一句没人核的「已隔离」
    # 就是同一个退回，只是上移了一层。
    - type: evidence_in
      kind: worktree_mode
      values:
      - isolated
      - shared_declared
    - type: claim_corroborated       # 说隔离了 -> 但这个目录不是链接工作树
      kind: worktree_mode
      claims:
      - isolated
      disproved_when:
        fact: in_linked_worktree
        equals: false
    - type: claim_corroborated       # 说按声明留在共享树 -> 但方案声明的是隔离
      kind: worktree_mode
      claims:
      - shared_declared
      disproved_when:
        fact: isolation_declared
        equals: true
