- id: E10
  phase: cleanup
  stage: writeback
  title: Task smart-close writeback
  directive: |
    产出：任务被标记为已关闭，并附一条说明
    完成：任务状态已更新为关闭，评论已附上
  deps:
  - E09g
  completion:
    type: all_checks
    checks:
    # 任务系统那一侧**刻意没有核对**，理由要写下来而不是留白：读它只有 MCP 这一条路，
    # 而 provider 是子进程、调不到 MCP。编一个「看起来在核」的事实比不核更糟 ——
    # 在 schema 里读着合理，在输出里不可证伪。这里的强制来自 E21 那个 gate 上的
    # task_close guard：动作发生前就被拦，而不是事后自陈。
    - type: evidence_equals
      kind: task_state
      value: closed
    # 可核实的那一半：收口写回留下的两处痕迹。「跑过了」因此不必靠自陈。
    - type: evidence_in
      kind: close_writeback
      values:
      - written
      - not_applicable
    - type: claim_corroborated       # 说写回跑过了 -> 但两处痕迹一个都没有
      kind: close_writeback
      claims:
      - written
      disproved_when:
        all_of:
        - {fact: shipped_block_present, equals: false}
        - {fact: history_record_exists, equals: false}
    - type: claim_corroborated       # 说不适用 -> 但按 slug 找到了方案文档
      kind: close_writeback
      claims:
      - not_applicable
      disproved_when:
        fact: plan_doc_found
        equals: true
