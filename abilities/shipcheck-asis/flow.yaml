- id: E19
  phase: cleanup
  stage: close
  title: Final summary + metrics
  directive: |
    产出：一份会话指标汇总
    完成：指标已汇总
  deps:
  - E12
  completion:
    type: all_checks
    checks:
    - type: evidence
      kind: session_metrics
    # 「这些数字来自运行时记录」是一句可以核对的声称，而它是这一步唯一不需要额外工作的答案。
    # 原判据只要求「有这么一行」，于是一份没人产出过的数字与一份如实抄下来的在日志里一样。
    # 运行时记录读不到时仍有诚实出口：把来源记成 own_account，那不是声称查无，不必核对。
    # 合法取值必须写出来，否则「不要声称 runtime」这条出口只存在于拒绝信息里：
    # 判据说了什么会被核对，却没说还可以记什么，读 spec 的人无从知道诚实路径叫什么。
    - type: evidence_in
      kind: metrics_source
      values:
      - runtime
      - own_account
    - type: claim_corroborated
      kind: metrics_source
      claims:
      - runtime
      disproved_when:
        fact: metrics_available
        equals: false
    # 会话裁决。**刻意不是一个合成分数**：声明里五个维度只有两个（completeness /
    # correctness，合计 0.6 权重）的输入是本引擎真正拥有的；efficiency 与 cost 依赖的
    # p50/p95 在声明里七层全部 status: placeholder，adherence 的 note 明写「MVP: assume
    # 1.0 for both」。把这 0.4 折进一个数字里，就得到一个读起来像实测、而近一半是替身的
    # figure —— 而折算之后那个替身再也看不见了。所以这里只要一个裁决，并核两件事。
    - type: evidence_in
      kind: session_verdict
      values:
      - green
      - yellow
      - red
    - type: claim_corroborated       # 任何裁决 -> 必须读到过那份声明的门槛
      kind: session_verdict
      claims:
      - green
      - yellow
      - red
      disproved_when:
        fact: slo_readable
        equals: ''
    - type: claim_corroborated       # 说 green -> 但声明自己把这种情形判为 critical
      kind: session_verdict
      claims:
      - green
      disproved_when:
        fact: error_violation_count
        count_gte: 3
