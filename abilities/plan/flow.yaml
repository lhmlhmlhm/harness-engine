# ability: plan —— 「散乱输入 → 结构化方案文档」的转写（对照用，非移植）
#
# 【它存在的理由，和 push 不同】push 验证的是 `variants` 原语能表达一条双形态流程；
# plan 验证的是**同一个 registry 能被两个 ability 共用而不复制**。源系统把这句写成了
# 明确承诺（plan/branch/README.md）：
#   「No edit to plan/SKILL.md / push/SKILL.md cores is needed to add an executor.」
# 而它成立的前提是二者读**同一份** `executors:` registry —— plan 调的就是 push 的脚本。
#
# 所以本 ability 不复制那份 registry，而是 `requires: [push]`：复用它注册的
# `plan_taxonomy` provider。复制一份进来会重新引入这套设计正要消灭的漂移。
#
# 【与 push 的形态差异，刻意保留】
#   * scope 是「一份待写的方案」而不是工作区 —— 同一个变体机制必须能挂在不同 scope 上
#   * 有一个「禁止 default」的 gate（slug 索取），是 preauth 语义的反面：不允许预授权
#   * 无 guard —— plan 不触发任何需要保护的外部动作，这一点与 push/shipcheck 都不同

version: 1
ability: plan
title: 方案生成（真实 plan 转写，双变体）
scope_kind: plan_slug

when: |
  要为**还没开始做**的事出一份结构化方案。产出是一份待推送的方案文档，不是代码。
  已经做完的工作要补记录，走 cr-to-task；有方案要推成任务，走 push。
  ux 变体只产出 ux 口味的方案；设计流程本身由 ux-agent 执行，不是本能力。
# 复用 push 注册的 provider —— 同一份 registry，一个事实来源。
requires: [push]

variants:
  values: [ship-check, ux]
  default: ship-check
  # 【刻意不声明 `fact:`，与 push 不同 —— 这不是遗漏】
  # push 的 scope 就是工作区，所以它能在 open 时从工作区派生出变体。
  # 而本流程的 scope 是「一份待写的方案」，工作区是**流程中途**才收集到的
  # （见 G02/G03）—— 在 open 时它还不存在。若照 push 那样声明 `fact: executor`，
  # 派生会拿 scope（一个方案标识）去喂给按路径匹配的解析器，任何方案都不命中、
  # 一律落到默认值，而输出仍写着「derived」。那是最坏的一种错：
  # **它长得和一次成功的派生完全一样**，然后设计类的步骤会以「不属于本流程」
  # 被拒绝 —— 而那个拒绝读起来是正确的。
  # 所以本流程的变体是「显式给出，否则默认」，并在 G02 用 evidence_matches_variant
  # 把「open 时钉的」与「流程后来查明的」对账。

facts:
  # 借 push 注册的 provider（见 requires），但**不是** plan_taxonomy —— 那个从 scope 读
  # 工作区，而本流程的 scope 是一份待写的方案。喂给它只会让任何方案都不命中、一律落默认，
  # 而输出仍写着「derived」。workspace_taxonomy 改从 run 自己记录的 workspace 证据派生
  # （G03 记，见下），这也是唯一能在本流程里回答这个问题的时点。
  providers: [workspace_taxonomy]

prose:
  root: prose/
  topics_dir: topics
  anchor_pattern: '^#{1,6}\s+Step:\s+{step_id}\b'

phases:
  - id: gather
    title: 信息收集（共享核心 + 变体专属字段）
    guide: gather.md
    goal:
      type: phase_steps_closed
  - id: derive
    title: 分类推导（共享）
    guide: derive.md
    goal:
      type: all_checks
      checks:
        - type: phase_steps_closed
        - type: evidence_in
          kind: scope
          values: [derived, fallback]
  - id: draft
    title: 起草与写盘前验证
    guide: draft.md
    goal:
      type: all_of
      steps: [W02]
      any_of:
        - [W01sc, W01ux]
  - id: save
    title: 确认与保存
    guide: save.md
    goal:
      type: all_checks
      checks:
        - type: phase_steps_closed
        - type: evidence_in
          kind: plan_status
          values: [pending]

steps:
  # ────────────────────────── gather ──────────────────────────
  - id: G01
    phase: gather
    title: 场景识别（选模板）
    deps: []
    completion:
      type: evidence_in
      kind: plan_type
      values: [change-proposal, feature-plan, refactor-plan, config-change, investigation, composite]
    directive: |
      产出：本次属于哪一类方案（决定后续用哪个模板、哪些字段必填）
      完成：类型已记录，且取自封闭枚举 —— 自造类型会让下游模板选择静默落空

  - id: G02
    phase: gather
    title: Executor 识别（决定本次走哪个变体）
    deps: [G01]
    completion:
      type: all_checks
      checks:
        - type: evidence_matches_variant
          kind: executor
        - type: evidence
          kind: executor_reason
    directive: |
      产出：从 registry 解析出的 executor + 解析理由（命中哪条规则，还是落到默认）
      完成：解析出的 executor **与本次 run 开启时钉定的变体一致**，且理由已记录
      失败：两者不一致说明这个 run 一开始就走错了形态 —— 关掉它、用正确的变体重开，
            **不要把记录的值改成和它一致**

  - id: G03
    phase: gather
    title: 通用块信息收集（目标 / 背景 / 约束 / 待确认事项）
    deps: [G02]
    completion:
      type: all_checks
      checks:
        - type: evidence
          kind: goal_statement
        - type: evidence
          kind: background
        - type: evidence
          kind: open_question
          min_count: 1
        # workspace 是通用块的一部分（源系统明列），而转写里曾整个漏掉 —— 于是
        # 「这个方案关于哪个工作区」在流程里无处可读，本层的变体核对也就无从做起。
        - type: evidence
          kind: workspace
    directive: |
      产出：所有变体共用的那几块 —— 目标、背景、约束、待确认事项，以及**本方案针对的工作区**
      完成：目标、背景、至少一条待确认事项、工作区都已记录
      注意：待确认事项一条都没有，通常意味着还没想清楚，而不是真的没有不确定

  - id: G04
    phase: gather
    topics: [uncertainty-is-not-a-fact]
    title: 已知不确定项（与已验证事实分开登记）
    deps: [G03]
    completion:
      type: evidence_all_in
      kind: uncertainty_disposition
      values: [pending, resolved, has_fallback]
    directive: |
      产出：每条未定的假设/依赖的处置 —— 待解决 / 已解决 / 已有降级路径
      完成：每一条都有处置结果
      失败：把不确定项塞进「已验证事实」会让下游把假设当事实看，跑到真验证时才炸

  - id: G05sc
    phase: gather
    topics: [uncertainty-is-not-a-fact]
    title: 代码类专属字段（交付方式 / 测试豁免 / 已验证事实）
    variants: [ship-check]
    deps: [G04]
    completion:
      type: all_checks
      checks:
        - type: evidence_in
          kind: delivery_mode
          values: [commit_and_review, commit_only, no_commit, local_git]
        - type: evidence_in
          kind: tests_exemption
          values: [none, no_test_framework, docs_only, config_only, generated_only, external_blocked]
        - type: evidence_all_in
          kind: verified_fact
          values: [hit]
    directive: |
      产出：交付方式 + 测试豁免类别 + 逐条实测过的前置事实
      完成：两个枚举都取自封闭集合，且每条已验证事实都实测命中

  - id: G05ux
    phase: gather
    title: 设计类专属字段（目标项目 / 参考输入 / 受影响产物 / 修订类型）
    variants: [ux]
    deps: [G04]
    completion:
      type: all_checks
      checks:
        - type: evidence
          kind: target_project
        - type: evidence
          kind: reference_input
        - type: evidence
          kind: affected_artifact
        - type: evidence_in
          kind: revision_kind
          values: [requirement-update, visual-refresh, flow-change, scope-add]
    directive: |
      产出：目标设计项目 + 参考输入 + 预期会改的产物 + 修订类型
      完成：四者都已记录，修订类型取自封闭枚举
      注意：修订类型是**活字段** —— 执行方据它决定从哪个阶段重新开始验，填错会重验错范围

  # ────────────────────────── derive ──────────────────────────
  - id: D01
    phase: derive
    title: 推导 tags
    deps: [G04]
    completion:
      type: evidence
      kind: tags
    directive: |
      产出：本方案的 tag 集合（由分类 registry 从工作区推导，不是手填）
      完成：tag 集合已记录（空集也算，但要显式）

  - id: D02
    phase: derive
    topics: [fallback-is-not-a-match]
    title: 推导 scope
    deps: [D01]
    completion:
      type: evidence_in
      kind: scope
      values: [derived, fallback]
    directive: |
      产出：本方案的 scope，以及它是被 registry 认出来的还是落到了兜底
      完成：两者之一已记录 —— 「认出来」和「兜底」在下游长得一样，必须可区分

  - id: D03
    phase: derive
    title: 并行调研（仅复杂场景）
    deps: [D02]
    optional: true
    completion:
      type: evidence
      kind: research_finding
      min_count: 2
    directive: |
      产出：若本次复杂到需要并行调研，各路的结论
      完成：至少两条调研结论（只有一条就不需要并行）
      跳过：确定性场景直接跳过本步，不要为了「看起来充分」凑调研

  # ────────────────────────── draft ──────────────────────────
  - id: W01sc
    phase: draft
    title: 代码类写盘前预检（备选验证可执行性 / 关键锚点）
    variants: [ship-check]
    deps: [D02]
    completion:
      type: all_checks
      checks:
        - type: evidence_equals
          kind: preflight_verdict
          value: verified
        - type: evidence_all_in
          kind: alt_verification_probe
          values: [runnable, skipped_by_condition]
    directive: |
      产出：方案里声明的每条备选验证是否真能跑 + 关键锚点是否真存在
      完成：裁决为 verified，且每条备选验证都可跑或按条件跳过
      失败：锚点不存在 → 改方案，不要改锚点去迎合方案

  - id: W01ux
    phase: draft
    title: 设计类写盘前预检（目标项目 / 参考输入可达）
    variants: [ux]
    deps: [D02]
    completion:
      type: all_checks
      checks:
        - type: evidence_equals
          kind: preflight_verdict
          value: verified
        - type: evidence_all_in
          kind: reference_input_probe
          values: [reachable]
    directive: |
      产出：目标设计项目存在 + 每个参考输入可达
      完成：裁决为 verified，且每个参考输入都可达

  - id: W02
    phase: draft
    title: 生成方案正文（按本变体的模板）
    deps: [D02]
    completion:
      type: all_checks
      checks:
        - type: evidence
          kind: plan_body
        # 共享步不能 deps 到只在某变体存在的步，所以「本变体的预检必须先过」写在这里。
        - type: all_of
          steps: []
          any_of:
            - [W01sc, W01ux]
    directive: |
      产出：方案正文，结构按本变体的模板（两个变体的模板不同）
      完成：正文已记录，且本变体的写盘前预检已通过

  # ────────────────────────── save ──────────────────────────
  - id: S01
    phase: save
    title: 🚦 slug 索取门（禁止 default）
    deps: [W02]
    gate: affirm
    completion:
      type: all_checks
      checks:
        - type: gate_recorded
        - type: evidence
          kind: slug_candidate
          min_count: 3
    directive: |
      产出：三个候选 slug + 人选定的那一个
      完成：确认门已记录，且至少三个候选被摆出来过
      失败：**禁止跳过本步直接 default 到一个 slug** —— 这一步的全部价值是人真的选过。
            候选少于三个等于没给选择

  - id: S02
    phase: save
    title: 写盘前自检（slug lint / schema lint）
    deps: [S01]
    completion:
      type: evidence_all_in
      kind: lint_result
      values: [pass]
    directive: |
      产出：slug 命名与 frontmatter schema 的逐项自检结果
      完成：每一项都是 pass —— 有一项不过就不写盘

  - id: S03
    phase: save
    title: 写入 pending 区
    deps: [S02]
    completion:
      type: all_checks
      checks:
        - type: evidence
          kind: plan_doc
        - type: evidence_in
          kind: plan_status
          values: [pending]
    directive: |
      产出：方案文档落盘到待推送区
      完成：文档路径已记录，状态为 pending

hooks:
  # 【为什么这里没有「分类兜底」hook，而 push 有】
  # push 的 scope 就是工作区，所以「registry 没认出这个工作区」对它是一条真实信号。
  # 本流程的 scope 是一份待写的方案，把它喂给按路径匹配的分类器**永远**不命中 ——
  # 那个 hook 在这里会每次都触发，而每次都触发的告警不是信号，是噪声，
  # 并且它会把「真的没被覆盖」淹掉。所以这条留在 push，不在这里。

  # G02 用 evidence_matches_variant 核对「记录的 executor」与「open 时钉的变体」，
  # 而那条**信 agent 记了真话**。这一条从 run 记录的 workspace 独立再算一次，
  # 两者不符时报出来 —— 一个信记录、一个信派生，同一个问题两条互不依赖的路径。
  - id: variant-disagrees-with-workspace
    trigger: phase_start
    phase: draft
    when:
      all_of:
        - fact: workspace_declared
          equals: true
        - fact: variant_agrees
          equals: false
    mode: contract
    obligation: true
    contract: |
      从本方案记录的工作区独立派生出的 executor 是 {{fact.derived_executor}}
      （{{fact.derived_executor_reason}}），而本次 run 是按 {{fact.run_variant}} 开的。
      两者不符意味着这个 run 一开始就走错了形态 —— 关掉它、用正确的 --variant 重开。
      若确实要按当前形态走（例如显式覆盖派生结果），说明理由后销账：
      harness discharge --run {{run_id}} --hook variant-disagrees-with-workspace \
        --evidence "<为什么以当前形态为准>"

  - id: non-default-variant-notice
    trigger: phase_start
    phase: draft
    # 读引擎自己的 run_variant，而不是从 scope 派生的事实 ——
    # 后者在本 ability 里恒为默认值（scope 不是工作区），于是这条通知在
    # 非默认变体下也永不触发，而「永不触发」和「条件不满足」在输出里长得一样。
    when:
      not:
        fact: run_variant
        equals: ship-check
    mode: contract
    obligation: false
    contract: |
      本次走非默认变体（{{fact.run_variant}}）。专属字段与模板都换成了该变体那套；
      默认变体的步骤在本次流程里不存在。
